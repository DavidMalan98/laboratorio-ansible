
    ---
- name: Obtener running-config de Cisco C3650 (Modo Comando Remoto)
  hosts: 10.1.4.124
  gather_facts: false

  vars:
    ip_switch: "192.168.1.20"
    usuario_switch: "admin"
    pass_switch: "Cu4tr0n3t*"

  tasks:
    - name: 1. Crear archivo temporal con los comandos exactos
      ansible.builtin.copy:
        dest: "/tmp/comandos_cisco.txt"
        content: |
          terminal length 0
          show running-config
          exit

    - name: 2. Ejecutar comandos inyectando el archivo (Sin terminales interactivas)
      ansible.builtin.shell: >
        sshpass -p '{{ pass_switch }}' ssh -T 
        -o KexAlgorithms=+diffie-hellman-group14-sha1 
        -o HostKeyAlgorithms=+ssh-rsa 
        -o StrictHostKeyChecking=no 
        {{ usuario_switch }}@{{ ip_switch }} < /tmp/comandos_cisco.txt
      register: resultado_show_run
      
    - name: 3. Borrar el archivo temporal por seguridad
      ansible.builtin.file:
        path: "/tmp/comandos_cisco.txt"
        state: absent

    - name: 4. Mostrar el resultado del show run en la consola
      ansible.builtin.debug:
        var: resultado_show_run.stdout_lines
