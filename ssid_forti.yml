---
- name: Obtener SSIDs de una red específica en FortiEdge Cloud
  hosts: localhost
  gather_facts: false
  vars:
    base_url: "https://fortiedge.forticloud.com"
    api_id: "40A9FF19-3956-45C6-BD1F-F823875E2BE8"
    api_password: "f002f97de90cdddb87c74aef42ba1885!1Aa"
    client_id: "fortiedgecloud"
    # La variable target_nwoid llegará automáticamente desde la Encuesta de AWX

  tasks:
    - name: Consultar la lista de SSIDs configurados en la red seleccionada
      ansible.builtin.uri:
        url: "{{ base_url }}/api/v1/networks/34470/fap/config/ssids/"
        method: GET
        url_username: "{{ api_id }}"
        url_password: "{{ api_password }}"
        force_basic_auth: true
        headers:
          Accept: "application/json"
          Client-Id: "{{ client_id }}"
        return_content: true
        status_code: 200
      register: ssid_response

    - name: Mostrar los SSIDs resultantes
      ansible.builtin.debug:
        var: ssid_response.json
