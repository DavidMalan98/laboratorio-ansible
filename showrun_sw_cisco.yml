---
- name: Obtener config de Cisco (Tuberia PTY Directa)
  hosts: 10.1.4.124
  gather_facts: false

  vars:
    ip_switch: "192.168.1.20"
    usuario_switch: "admin"
    pass_switch: "Cu4tr0n3t*"

  tasks:
    - name: Inyectar comandos forzando un Pseudo-Terminal (-tt) y retencion de sesion
      ansible.builtin.shell: |
        (
          echo "terminal length 0"
          sleep 1
          echo "show running-config"
          # Mantenemos la conexion abierta 20 segundos para que el switch termine de imprimir
          sleep 20 
          echo "exit"
          sleep 1
        ) | sshpass -p '{{ pass_switch }}' ssh -tt -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o StrictHostKeyChecking=no {{ usuario_switch }}@{{ ip_switch }}
      register: resultado_show_run
      
    - name: Mostrar la configuracion obtenida
      ansible.builtin.debug:
        var: resultado_show_run.stdout_lines
