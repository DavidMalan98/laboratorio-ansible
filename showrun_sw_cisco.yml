---
- name: Obtener running-config de Cisco (Modo OpenSSH con Throttling)
  hosts: 10.1.4.124
  gather_facts: false

  vars:
    ip_switch: "192.168.1.20"
    usuario_switch: "admin"
    pass_switch: "Cu4tr0n3t*"

  tasks:
    - name: Inyectar comandos con pausas (sleep) para no desbordar el buffer del switch
      ansible.builtin.shell: |
        (
          echo "terminal length 0"
          sleep 1
          echo "show running-config"
          sleep 3
          echo "exit"
          sleep 1
        ) | sshpass -p '{{ pass_switch }}' ssh -T -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o StrictHostKeyChecking=no {{ usuario_switch }}@{{ ip_switch }}
      register: resultado_show_run

    - name: Mostrar el resultado en pantalla
      ansible.builtin.debug:
        var: resultado_show_run.stdout_lines
