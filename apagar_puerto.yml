---
- name: Apagar un puerto en switch Cisco C3650 (Modo Directo)
  hosts: all
  gather_facts: false
  # Cambiamos a ssh puro para forzar el cliente nativo
  connection: ssh

  vars:
    puerto: "GigabitEthernet1/0/23"
    # Incluimos StrictHostKeyChecking=no para evitar que falle pidiendo confirmar la llave
    ansible_ssh_common_args: '-o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o StrictHostKeyChecking=no'

  tasks:
    - name: Deshabilitar el puerto {{ puerto }} por CLI
      ansible.builtin.raw: |
        configure terminal
        interface {{ puerto }}
        shutdown
        end
        write memory
