---
- name: Respaldar configuracion de Switch Cisco via FTP
  hosts: 10.1.4.124
  gather_facts: false

  vars:
    # Credenciales y conexión
    ip_switch: "192.168.1.20"
    usuario_switch: "admin"
    pass_switch: "Cu4tr0n3t*"

  tasks:
    - name: Instalar sshpass en RHEL (Requerido para pasar la contraseña)
      ansible.builtin.package:
        name: sshpass
        state: present
      become: yes

    - name: Enviar comando para redirigir el running-config al FTP
      ansible.builtin.shell: |
        sshpass -p '{{ pass_switch }}' ssh -T -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o StrictHostKeyChecking=no {{ usuario_switch }}@{{ ip_switch }} << 'EOF'
        show running-config | redirect ftp://anonymous:@192.168.1.10/configuracion2-demo-sw1.txt
        exit
        EOF
