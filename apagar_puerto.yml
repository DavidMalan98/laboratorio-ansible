---
- name: Apagar puerto Cisco C3650
  hosts: all
  gather_facts: false
  connection: local

  vars:
    puerto: "GigabitEthernet1/0/23"

  tasks:
    - name: 1. Crear config de OpenSSL para revivir SHA-1
      ansible.builtin.copy:
        dest: /tmp/legacy_openssl.cnf
        content: |
          openssl_conf = openssl_init
          [openssl_init]
          providers = provider_sect
          [provider_sect]
          default = default_sect
          legacy = legacy_sect
          [default_sect]
          activate = 1
          [legacy_sect]
          activate = 1

    - name: 2. Conectar y apagar el puerto
      ansible.builtin.expect:
        command: ssh -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o StrictHostKeyChecking=no {{ ansible_user }}@{{ inventory_hostname }}
        timeout: 30
        responses:
          '(?i)password': "{{ ansible_password }}"
          '[>#]': 
            - "terminal length 0"
            - "configure terminal"
            - "interface {{ puerto }}"
            - "shutdown"
            - "end"
            - "write memory"
            - "exit"
      environment:
        # Ahora SÍ apuntamos a un archivo real que carga el módulo legacy
        OPENSSL_CONF: "/tmp/legacy_openssl.cnf"
