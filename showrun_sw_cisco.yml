---
- name: Obtener running-config de Cisco (Modo OpenSSH con Throttling)
  hosts: 10.1.4.124
  gather_facts: false

  vars:
    ip_switch: "192.168.1.20"
    usuario_switch: "admin"
    pass_switch: "Cu4tr0n3t*"

  tasks:
    - name: Ejecutar show run y forzar desconexión mediante timeout
      ansible.builtin.shell: |
        timeout 60 sshpass -p '{{ pass_switch }}' ssh -T -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o StrictHostKeyChecking=no {{ usuario_switch }}@{{ ip_switch }} << 'EOF'
        terminal length 0
        show running-config
        exit
        EOF
      register: resultado_show_run
      # El código 124 significa que el timeout cortó la sesión exitosamente
      failed_when: resultado_show_run.rc not in [0, 124]
      changed_when: false

    - name: Mostrar el resultado en pantalla
      ansible.builtin.debug:
        var: resultado_show_run.stdout_lines
