---
- name: Apagar un puerto en switch Cisco C3650 (Modo Definitivo)
  hosts: all
  gather_facts: false
  connection: local

  vars:
    puerto: "GigabitEthernet1/0/23"
    # Reducimos los parámetros para no sobrecargar el cliente SSH
    argumentos_ssh: '-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o StrictHostKeyChecking=no'

  tasks:
    - name: Inyectar comandos por SSH evadiendo bloqueo de OpenSSL
      ansible.builtin.shell: |
        sshpass -e ssh -tt {{ argumentos_ssh }} {{ ansible_user }}@{{ inventory_hostname }} << 'EOF'
        terminal length 0
        configure terminal
        interface {{ puerto }}
        shutdown
        end
        write memory
        exit
        EOF
      environment:
        SSHPASS: "{{ ansible_password }}"
        # Estas dos líneas desactivan la política restrictiva de OpenSSL en Linux modernos
        OPENSSL_SYSTEM_CIPHERS_OVERRIDE: "0"
        OPENSSL_CONF: "/dev/null"
