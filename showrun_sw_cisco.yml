---
- name: Obtener running-config de Cisco C3650 (Modo Comando Remoto)
  hosts: 10.1.4.124
  gather_facts: false

  vars:
    ip_switch: "192.168.1.20"
    usuario_switch: "admin"
    # Recuerda: En producción es mejor encriptar esta contraseña con ansible-vault
    pass_switch: "Cu4tr0n3t*"

  tasks:
    - name: Ejecutar show run mediante SSH directo (usando pipe)
      ansible.builtin.shell: |
        printf "terminal length 0\nshow running-config\nexit\n" | sshpass -p '{{ pass_switch }}' ssh -T -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o StrictHostKeyChecking=no {{ usuario_switch }}@{{ ip_switch }}
      register: resultado_show_run
      changed_when: false

    - name: Mostrar el resultado del show run en la consola
      ansible.builtin.debug:
        var: resultado_show_run.stdout_lines
