---
- name: Obtener running-config de Cisco C3650
  hosts: all
  gather_facts: false

  tasks:
    - name: Ejecutar show running-config
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: resultado_show_run

    - name: Mostrar la configuracion
      ansible.builtin.debug:
        msg: "{{ resultado_show_run.stdout_lines[0] }}"
