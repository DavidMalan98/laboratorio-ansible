---
- name: Obtener SSIDs de una red específica en FortiEdge Cloud
  hosts: localhost
  gather_facts: false
  vars:
    base_url: "https://fortiedge.forticloud.com"
    auth_url: "https://customerapiauth.fortinet.com/api/v1/oauth/token/" 
    api_id: "40A9FF19-3956-45C6-BD1F-F823875E2BE8"
    api_password: "f002f97de90cdddb87c74aef42ba1885!1Aa"
    client_id: "fortiedgecloud"
    
    # ID real de la red (oid de DEMO_GPO_MODELO)
    target_nwoid: "33569"

  tasks:
    - name: Paso 1 - Obtener Token de Acceso
      ansible.builtin.uri:
        url: "{{ auth_url }}"
        method: POST
        body_format: json
        body:
          username: "{{ api_id }}"
          password: "{{ api_password }}"
          client_id: "{{ client_id }}"
          grant_type: "password"
        return_content: true
      register: login_response

    - name: Paso 2 - Consultar la lista de SSIDs en la red seleccionada
      ansible.builtin.uri:
        # Aquí inyectamos el ID de la red dinámicamente en la ruta
        url: "{{ base_url }}/api/v1/networks/{{ target_nwoid }}/fap/config/ssids/"
        method: GET
        headers:
          Accept: "application/json"
          Client-Id: "{{ client_id }}"
          Authorization: "Bearer {{ login_response.json.access_token }}"
        return_content: true
        status_code: 200
      register: ssid_response

    - name: Mostrar los SSIDs resultantes
      ansible.builtin.debug:
        var: ssid_response.json
