---
- name: Obtener running-config de Cisco C3650 (Modo Nativo con Paramiko)
  hosts: localhost
  gather_facts: false

  vars:
    ansible_connection: network_cli
    ansible_network_os: cisco.ios.ios
    
    ansible_host: "192.168.1.20"
    ansible_user: "admin"
    ansible_password: "Cu4tr0n3t*"

  tasks:
    - name: 0. Configurar algoritmos legacy en ~/.ssh/config para Paramiko
      ansible.builtin.blockinfile:
        path: ~/.ssh/config
        create: yes
        mode: '0600'
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR CISCO {{ ansible_host }}"
        block: |
          Host {{ ansible_host }}
            KexAlgorithms +diffie-hellman-group14-sha1
            HostKeyAlgorithms +ssh-rsa
            StrictHostKeyChecking no

    - name: 1. Ejecutar show run (Ansible maneja la paginación automáticamente)
      cisco.ios.ios_command:
        commands: show running-config
      register: resultado_show_run

    - name: 2. Mostrar el resultado en pantalla
      ansible.builtin.debug:
        var: resultado_show_run.stdout_lines[0]
